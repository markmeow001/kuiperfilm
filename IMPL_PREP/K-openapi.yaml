openapi: 3.1.0
info:
  title: KuiperAI Public API
  version: 1.0.0
  description: |
    短劇 AI 生成平台的 REST API。讀法參考 K-openapi-spec.md。
    - 25 個高槓桿 endpoint 寫完整 request/response
    - 其餘 96 個用 summary（method + path + operationId + tag），實作時參考同 tag 範本
  contact: { name: KuiperAI Team, email: api@kuiperfilmailab.com }

servers:
  - url: https://api.kuiperfilmailab.com
    description: Production
  - url: https://staging-api.kuiperfilmailab.com
    description: Staging
  - url: http://localhost:4010
    description: Local mock (prism)

tags:
  - name: Auth
  - name: Users
  - name: Workspaces
  - name: Projects
  - name: Episodes
  - name: Panels
  - name: Subjects
    description: Character / Location / Prop
  - name: Runs
  - name: Voice
  - name: Render
  - name: Share
  - name: Discover
  - name: Notifications
  - name: Versions
  - name: Admin
  - name: Onboarding
  - name: Webhooks
  - name: EditRequests

security:
  - cookieAuth: []
  - bearerAuth: []
  - apiKeyAuth: []

paths:

  # ════════════════════════════════════════════════════════
  # 1. PANELS — 25 個高槓桿之 1-5
  # ════════════════════════════════════════════════════════

  /panels/{id}:
    parameters:
      - $ref: '#/components/parameters/PanelId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getPanel
      tags: [Panels]
      summary: 取得 panel 完整資料含版本歷史
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Panel' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/InsufficientPermission' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    patch:
      operationId: updatePanel
      tags: [Panels]
      summary: 更新 panel 欄位（含 optimistic lock）
      parameters:
        - name: If-Match
          in: header
          description: 必帶 panel.version，避免覆蓋他人改動
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 5000 }
                sceneContext: { type: string, maxLength: 2000 }
                motionLine: { type: string, maxLength: 500 }
                generationMode: { $ref: '#/components/schemas/GenerationMode' }
                perShotProvider: { type: string, nullable: true }
                targetDuration: { type: number, minimum: 2, maximum: 15 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Panel' } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
    delete:
      operationId: deletePanel
      tags: [Panels]
      responses:
        '204': { description: Deleted }

  /panels/{id}:regenerate:
    parameters:
      - $ref: '#/components/parameters/PanelId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: regeneratePanel
      tags: [Panels, Runs]
      summary: 重新生成 panel，回傳啟動的 Run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, mode]
              properties:
                provider: { $ref: '#/components/schemas/ProviderModelKey' }
                mode: { $ref: '#/components/schemas/GenerationMode' }
                asNewVersion:
                  type: boolean
                  default: true
                  description: false → 直接覆蓋當前 version
      responses:
        '202':
          description: Accepted, run created
          headers:
            Location:
              schema: { type: string }
              description: /runs/{id}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Run' } }
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /panels:bulk-regenerate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: bulkRegeneratePanels
      tags: [Panels, Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [panelIds, provider, mode]
              properties:
                panelIds:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 50
                provider: { type: string }
                mode: { $ref: '#/components/schemas/GenerationMode' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          runs:
                            type: array
                            items: { $ref: '#/components/schemas/Run' }
                          totalCreditsEstimated: { type: integer }

  /episodes/{id}/panels:
    parameters:
      - $ref: '#/components/parameters/EpisodeId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    get:
      operationId: listEpisodePanels
      tags: [Panels, Episodes]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Panel' }

  # ════════════════════════════════════════════════════════
  # 2. EPISODES & SCRIPT — 高槓桿 6-8
  # ════════════════════════════════════════════════════════

  /projects/{id}/episodes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listProjectEpisodes
      tags: [Episodes]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Episode' }
    post:
      operationId: createEpisode
      tags: [Episodes]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                scriptText: { type: string, maxLength: 100000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Episode' } }

  /projects/{id}/script:upload:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: uploadScript
      tags: [Episodes]
      summary: 上傳 .docx/.txt/.md 自動拆集
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [TABLE, MARKERS, PROSE]
                  default: PROSE
                  description: 解析模式
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          episodes:
                            type: array
                            items: { $ref: '#/components/schemas/Episode' }
                          scriptRunId: { type: string }
        '413':
          description: File too large (max 10MB)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /scripts:analyze:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: analyzeScript
      tags: [Episodes]
      summary: 用 LLM 分析劇本拆鏡 + 推測角色/場景/道具
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scriptText, projectId]
              properties:
                scriptText: { type: string, maxLength: 50000 }
                projectId: { type: string }
                language: { $ref: '#/components/schemas/Language' }
                pace:
                  type: string
                  enum: [AMBIENT, FAST_HOOK]
                  default: FAST_HOOK
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Run' } }

  # ════════════════════════════════════════════════════════
  # 3. RUNS — 高槓桿 9-11
  # ════════════════════════════════════════════════════════

  /runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^run_[0-9a-zA-Z]{26}$' }
    get:
      operationId: getRun
      tags: [Runs]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Run' } }

  /runs/{id}:cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: cancelRun
      tags: [Runs]
      summary: 取消，已扣點仍會退（失敗不扣點原則）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Run' } }
        '409':
          description: Run already in terminal state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /runs/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: Last-Event-ID
        in: header
        schema: { type: string }
        description: SSE 重連用，從此 seq 後繼續
    get:
      operationId: streamRunEvents
      tags: [Runs]
      summary: SSE 串流 run 進度
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  event types:
                  - run.update    { status, progress }
                  - run.step      RunStep
                  - run.complete  { status, creditsActual }
                  - run.error     { code, retriable }

  # ════════════════════════════════════════════════════════
  # 4. SUBJECTS — 高槓桿 12-14
  # ════════════════════════════════════════════════════════

  /projects/{id}/characters:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listCharacters
      tags: [Subjects]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Character' }
    post:
      operationId: createCharacter
      tags: [Subjects]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                essence: { type: string, maxLength: 500 }
                appearance: { type: string, maxLength: 2000 }
                clothing: { type: string, maxLength: 2000 }
                voiceId: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Character' } }

  /characters/{id}/appearances:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^char_[0-9a-zA-Z]{26}$' }
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: uploadCharacterAppearance
      tags: [Subjects]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                description: { type: string, maxLength: 500 }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/CharacterAppearance' } }

  # ════════════════════════════════════════════════════════
  # 5. WORKSPACES — 高槓桿 15-17
  # ════════════════════════════════════════════════════════

  /workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^ws_[0-9a-zA-Z]{26}$' }
    get:
      operationId: getWorkspace
      tags: [Workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/Workspace' } }

  /workspaces/{id}/invites:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: inviteToWorkspace
      tags: [Workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invites]
              properties:
                invites:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [email, role]
                    properties:
                      email: { type: string, format: email }
                      role: { $ref: '#/components/schemas/UserRole' }
                      message: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WorkspaceInvite' }
        '422':
          description: Plan seat limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /workspaces/{id}/audit-log:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: scope
        in: query
        schema:
          type: string
          enum: [WORKSPACE, PROJECT, BILLING, API]
      - name: actorId
        in: query
        schema: { type: string }
    get:
      operationId: listAuditLog
      tags: [Workspaces]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }

  # ════════════════════════════════════════════════════════
  # 6. EDIT REQUESTS — 高槓桿 18-19
  # ════════════════════════════════════════════════════════

  /workspaces/{id}/edit-requests:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createEditRequest
      tags: [EditRequests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope:
                  type: object
                  properties:
                    episodeIds: { type: array, items: { type: string } }
                    characterIds: { type: array, items: { type: string } }
                    locationIds: { type: array, items: { type: string } }
                    propIds: { type: array, items: { type: string } }
                    workspaceSettings: { type: boolean, default: false }
                reason: { type: string, minLength: 20, maxLength: 500 }
                requestedDuration:
                  type: string
                  enum: [TEMP_24H, TEMP_7D, TEMP_30D, PERMANENT]
                  default: TEMP_7D
      responses:
        '201':
          description: Created, owners notified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/EditRequest' } }

  /edit-requests/{id}:approve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^er_[0-9a-zA-Z]{26}$' }
    post:
      operationId: approveEditRequest
      tags: [EditRequests]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grantedDuration:
                  type: string
                  enum: [TEMP_24H, TEMP_7D, TEMP_30D, PERMANENT]
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/EditRequest' } }

  # ════════════════════════════════════════════════════════
  # 7. SHARE / PUBLIC — 高槓桿 20-22
  # ════════════════════════════════════════════════════════

  /projects/{id}:publish:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: publishProject
      tags: [Share]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { $ref: '#/components/schemas/ProjectVisibility' }
                password: { type: string, minLength: 6 }
                expiresAt: { type: string, format: date-time }
                allowClone: { type: boolean, default: false }
                allowComment: { type: boolean, default: true }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/PublicShare' } }

  /v/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPublicShare
      tags: [Share]
      security: []
      summary: 公開頁，SSR + 不需登入
      responses:
        '200':
          description: OK
          content:
            text/html: { schema: { type: string } }
            application/json:
              schema: { $ref: '#/components/schemas/PublicShareView' }
        '401':
          description: Password required
        '410':
          description: Gone (expired)

  /share/{slug}:clone:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: clonePublicShare
      tags: [Share]
      responses:
        '201':
          description: Cloned to current user's workspace
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          newProjectId: { type: string }
                          workspaceId: { type: string }

  # ════════════════════════════════════════════════════════
  # 8. AUTH — 高槓桿 23
  # ════════════════════════════════════════════════════════

  /auth/magic-link:
    post:
      operationId: magicLinkRequest
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                redirectTo: { type: string }
      responses:
        '200':
          description: Email sent (always 200 to avoid email enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sentAt: { type: string, format: date-time }
        '429':
          description: Rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ════════════════════════════════════════════════════════
  # 9. WEBHOOKS — 高槓桿 24-25
  # ════════════════════════════════════════════════════════

  /webhook/stripe:
    post:
      operationId: stripeWebhook
      tags: [Webhooks]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Acknowledged }
        '400':
          description: Signature invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /webhook/provider/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProviderName' }
    post:
      operationId: providerCallback
      tags: [Webhooks]
      security:
        - providerHmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, status]
              properties:
                taskId: { type: string }
                status: { type: string }
                outputUrl: { type: string }
                error: { type: object }
      responses:
        '200': { description: Acknowledged }

  # ════════════════════════════════════════════════════════
  # 10. 剩餘 96 個 endpoint — summary-only
  # 實作時參考同 tag 的高槓桿範本
  # ════════════════════════════════════════════════════════

  /panels/{id}:delete-soft:
    post:
      operationId: softDeletePanel
      tags: [Panels]
      responses: { '200': { description: OK } }

  /panels/{id}/insert-after:
    post:
      operationId: insertPanelAfter
      tags: [Panels]
      responses: { '201': { description: Created } }

  /episodes/{id}:
    patch:
      operationId: updateEpisode
      tags: [Episodes]
      responses: { '200': { description: OK } }

  /episodes/{id}/reorder:
    post:
      operationId: reorderEpisodePanels
      tags: [Episodes]
      responses: { '200': { description: OK } }

  /episodes/{id}/render-queue:
    get:
      operationId: getRenderQueue
      tags: [Render]
      responses: { '200': { description: OK } }

  /episodes/{id}:start-render:
    post:
      operationId: startEpisodeRender
      tags: [Render]
      responses: { '202': { description: Accepted } }

  /episodes/{id}:pause-render:
    post:
      operationId: pauseEpisodeRender
      tags: [Render]
