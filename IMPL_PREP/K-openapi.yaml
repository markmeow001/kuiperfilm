# ════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════

components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kp_session
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    providerHmac:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: HMAC-SHA256(provider_secret, body)

  parameters:
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      schema: { type: string, pattern: '^ws_[0-9a-zA-Z]{26}$' }
      description: 標識操作所在 workspace
    PanelId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^pnl_[0-9a-zA-Z]{26}$' }
    EpisodeId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^ep_[0-9a-zA-Z]{26}$' }
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^prj_[0-9a-zA-Z]{26}$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: 上一頁回傳的 pagination.cursor
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 100 }
      description: 24h 內同 key 重送回原結果

  responses:
    Unauthenticated:
      description: 沒登入
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InsufficientPermission:
      description: RBAC 擋下
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ResourceNotFound:
      description: 找不到
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: optimistic lock fail
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BusinessRuleViolation:
      description: 業務規則擋下
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: 429
      headers:
        Retry-After:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    SuccessEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            requestId: { type: string }

    PaginatedEnvelope:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array }
        pagination:
          type: object
          properties:
            cursor: { type: string, nullable: true }
            hasMore: { type: boolean }
            total: { type: integer, nullable: true }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            userMessage: { type: string }
            details: { type: object }
            traceId: { type: string }

    GenerationMode:
      type: string
      enum: [DIRECT_T2V, R2V_WITH_SUBJECTS, T2I_THEN_I2V, R2V_WITH_MOTION_REF]

    ProviderModelKey:
      type: string
      description: |
        Provider + model combo used for video generation (body field).
        Format: UPPER_SNAKE. Different from ProviderName which is the URL slug for webhook callbacks.
      enum: [ARK_SEEDANCE_2, ATLASCLOUD_SEEDANCE_2, FAL_SEEDANCE_PRO, BOBAPI_SEEDANCE_2, KLING_OMNI_30, TENCENT_HUNYUAN]

    ProviderName:
      type: string
      description: |
        Provider company slug used in webhook callback URLs `/webhook/provider/{name}`.
        Lower-snake. Tencent covers Hunyuan + VOD/COS routes; Kling callbacks come via Tencent VOD.
      enum: [ark, atlascloud, fal, bobapi, tencent]

    ProjectVisibility:
      type: string
      enum: [PRIVATE, WORKSPACE, UNLISTED, PUBLIC]

    PanelStatus:
      type: string
      enum: [DRAFT, GENERATING, COMPLETED, FAILED, OUTDATED]

    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED, RETRYING]

    UserRole:
      type: string
      enum: [OWNER, ADMIN, EDITOR, COMMENTER, VIEWER, BILLING, GUEST]

    Plan:
      type: string
      enum: [FREE, CREATOR, STUDIO, TEAM]

    Language:
      type: string
      enum: [zh-CN, en, ja, ko, es]

    User:
      type: object
      required: [id, email, name, plan, createdAt]
      properties:
        id: { type: string, pattern: '^usr_[0-9a-zA-Z]{26}$' }
        email: { type: string, format: email }
        name: { type: string }
        publicHandle: { type: string, nullable: true }
        publicBio: { type: string, nullable: true }
        avatarUrl: { type: string, format: uri, nullable: true }
        plan: { $ref: '#/components/schemas/Plan' }
        language: { $ref: '#/components/schemas/Language' }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Workspace:
      type: object
      required: [id, name, slug, plan, ownerId, createdAt]
      properties:
        id: { type: string, pattern: '^ws_[0-9a-zA-Z]{26}$' }
        name: { type: string }
        slug: { type: string }
        iconUrl: { type: string, format: uri, nullable: true }
        plan: { $ref: '#/components/schemas/Plan' }
        annualBilling: { type: boolean }
        seatCount: { type: integer }
        seatLimit: { type: integer }
        creditsRemaining: { type: integer }
        creditsLimit: { type: integer }
        ownerId: { type: string }
        createdAt: { type: string, format: date-time }

    WorkspaceMember:
      type: object
      properties:
        userId: { type: string }
        workspaceId: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        invitedBy: { type: string }
        joinedAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    WorkspaceInvite:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        invitedBy: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    Project:
      type: object
      required: [id, workspaceId, title, visibility, createdAt]
      properties:
        id: { type: string, pattern: '^prj_[0-9a-zA-Z]{26}$' }
        workspaceId: { type: string }
        title: { type: string }
        synopsis: { type: string, nullable: true }
        genre: { type: string, nullable: true }
        coverUrl: { type: string, format: uri, nullable: true }
        visibility: { $ref: '#/components/schemas/ProjectVisibility' }
        generationMode: { $ref: '#/components/schemas/GenerationMode' }
        defaultProvider: { type: string, nullable: true }
        stylePresetKey: { type: string, nullable: true }
        episodeCount: { type: integer }
        ownerId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Episode:
      type: object
      required: [id, projectId, sequence, title, status]
      properties:
        id: { type: string, pattern: '^ep_[0-9a-zA-Z]{26}$' }
        projectId: { type: string }
        sequence: { type: integer }
        title: { type: string }
        synopsis: { type: string, nullable: true }
        scriptText: { type: string, nullable: true }
        targetDuration: { type: integer, description: 秒 }
        status:
          type: string
          enum: [DRAFT, SCRIPT_READY, STORYBOARD_READY, RENDERING, DONE]
        panelCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Panel:
      type: object
      required: [id, episodeId, sequence, description, status, generationMode, version, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: '^pnl_[0-9a-zA-Z]{26}$' }
        episodeId: { type: string }
        sequence: { type: integer, minimum: 1 }
        description: { type: string, maxLength: 5000 }
        sceneContext: { type: string, nullable: true }
        motionLine: { type: string, nullable: true }
        srtSegment: { type: string, nullable: true }
        generationMode: { $ref: '#/components/schemas/GenerationMode' }
        perShotProvider: { type: string, nullable: true }
        targetDuration: { type: number, minimum: 2, maximum: 15 }
        status: { $ref: '#/components/schemas/PanelStatus' }
        version: { type: integer, description: optimistic lock 版本 }
        currentVersionId: { type: string, nullable: true }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        videoUrl: { type: string, format: uri, nullable: true }
        characters:
          type: array
          items:
            type: object
            properties:
              characterId: { type: string }
              appearanceId: { type: string, nullable: true }
              asAnchor: { type: boolean }
        locations:
          type: array
          items:
            type: object
            properties:
              locationId: { type: string }
              variantId: { type: string, nullable: true }
        props:
          type: array
          items:
            type: object
            properties:
              propId: { type: string }
              holderId: { type: string, nullable: true }
        versions:
          type: array
          items: { $ref: '#/components/schemas/PanelVersion' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PanelVersion:
      type: object
      properties:
        id: { type: string }
        panelId: { type: string }
        version: { type: integer }
        provider: { type: string }
        generationMode: { $ref: '#/components/schemas/GenerationMode' }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        videoUrl: { type: string, format: uri, nullable: true }
        creditsUsed: { type: integer }
        isFavorite: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }

    Character:
      type: object
      required: [id, projectId, name]
      properties:
        id: { type: string, pattern: '^char_[0-9a-zA-Z]{26}$' }
        projectId: { type: string }
        name: { type: string, maxLength: 100 }
        essence: { type: string, nullable: true }
        appearance: { type: string, nullable: true }
        clothing: { type: string, nullable: true }
        voiceId: { type: string, nullable: true }
        consistency: { type: number, minimum: 0, maximum: 1 }
        currentAppearanceId: { type: string, nullable: true }
        appearances:
          type: array
          items: { $ref: '#/components/schemas/CharacterAppearance' }
        sourceCharacterId: { type: string, nullable: true, description: 跨專案 link 來源 }
        usageCount: { type: integer }
        createdAt: { type: string, format: date-time }

    CharacterAppearance:
      type: object
      properties:
        id: { type: string }
        characterId: { type: string }
        label: { type: string, description: e.g. v1 / v2 / 雨夜版 }
        imageUrl: { type: string, format: uri }
        description: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    Location:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        coverUrl: { type: string, format: uri, nullable: true }
        views:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string, enum: [WIDE, MEDIUM, CLOSE] }
              imageUrl: { type: string, format: uri }
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string, description: e.g. 雨夜 / 雪天 }
              imageUrl: { type: string, format: uri }

    Prop:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        imageUrl: { type: string, format: uri, nullable: true }
        holderId: { type: string, nullable: true, description: 主要角色綁定 }

    Run:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string, pattern: '^run_[0-9a-zA-Z]{26}$' }
        kind:
          type: string
          enum: [SCRIPT_ANALYZE, GENERATE_PANEL, BATCH_REGENERATE, BATCH_SYNTHESIZE, COMPOSE_VIDEO, RENDER_QUEUE]
        status: { $ref: '#/components/schemas/RunStatus' }
        provider: { type: string, nullable: true }
        creditsEstimated: { type: integer }
        creditsActual: { type: integer, nullable: true }
        progress: { type: number, minimum: 0, maximum: 1 }
        panelId: { type: string, nullable: true }
        episodeId: { type: string, nullable: true }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            providerCode: { type: string, nullable: true }
            retriable: { type: boolean }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RunStep' }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    RunStep:
      type: object
      properties:
        id: { type: string }
        runId: { type: string }
        seq: { type: integer }
        name: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        output: { type: object, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    DialogueLine:
      type: object
      properties:
        id: { type: string }
        episodeId: { type: string }
        panelId: { type: string, nullable: true }
        characterId: { type: string, nullable: true }
        text: { type: string }
        voiceId: { type: string, nullable: true }
        tone: { type: string, nullable: true }
        speed: { type: number, minimum: 0.5, maximum: 2 }
        pitch: { type: number, minimum: -12, maximum: 12 }
        language: { $ref: '#/components/schemas/Language' }
        audioUrl: { type: string, format: uri, nullable: true }
        duration: { type: number, nullable: true }

    Voice:
      type: object
      properties:
        id: { type: string }
        provider: { type: string }
        name: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        gender: { type: string, enum: [MALE, FEMALE, NEUTRAL] }
        age: { type: string, enum: [CHILD, YOUTH, ADULT, ELDERLY] }
        previewUrl: { type: string, format: uri }
        styles:
          type: array
          items: { type: string }

    Notification:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        kind:
          type: string
          enum:
            - RENDER_DONE
            - RENDER_FAILED
            - INVITE_RECEIVED
            - EDIT_REQUEST_RECEIVED
            - EDIT_REQUEST_APPROVED
            - EDIT_REQUEST_DENIED
            - PAYMENT_SUCCEEDED
            - PAYMENT_FAILED
            - WEEKLY_DIGEST
            - QUOTA_WARNING
            - SHARE_LIKED
            - SHARE_COMMENTED
        title: { type: string }
        body: { type: string }
        actionUrl: { type: string, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    PublicShare:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        slug: { type: string }
        visibility: { $ref: '#/components/schemas/ProjectVisibility' }
        passwordHash: { type: string, nullable: true, writeOnly: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        allowClone: { type: boolean }
        allowComment: { type: boolean }
        viewCount: { type: integer }
        likeCount: { type: integer }
        publishedAt: { type: string, format: date-time }

    PublicShareView:
      type: object
      description: 公開頁可見的 project 資料（不含敏感欄位）
      properties:
        title: { type: string }
        synopsis: { type: string, nullable: true }
        coverUrl: { type: string, format: uri, nullable: true }
        creator:
          type: object
          properties:
            handle: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        episodes:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              videoUrl: { type: string, format: uri }
              duration: { type: number }
        likeCount: { type: integer }
        viewCount: { type: integer }
        publishedAt: { type: string, format: date-time }
        allowComment: { type: boolean }
        allowClone: { type: boolean }

    Comment:
      type: object
      properties:
        id: { type: string }
        publicShareId: { type: string }
        userId: { type: string }
        body: { type: string, maxLength: 2000 }
        parentId: { type: string, nullable: true }
        author:
          type: object
          properties:
            handle: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    EditRequest:
      type: object
      properties:
        id: { type: string, pattern: '^er_[0-9a-zA-Z]{26}$' }
        workspaceId: { type: string }
        requesterId: { type: string }
        scope:
          type: object
          properties:
            episodeIds: { type: array, items: { type: string } }
            characterIds: { type: array, items: { type: string } }
            locationIds: { type: array, items: { type: string } }
            propIds: { type: array, items: { type: string } }
            workspaceSettings: { type: boolean }
        reason: { type: string }
        status:
          type: string
          enum: [PENDING, APPROVED, DENIED, EXPIRED, REVOKED]
        requestedDuration: { type: string, enum: [TEMP_24H, TEMP_7D, TEMP_30D, PERMANENT] }
        grantedDuration: { type: string, nullable: true }
        approvedBy: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AuditLog:
      type: object
      properties:
        id: { type: string }
        workspaceId: { type: string }
        actorId: { type: string }
        actorName: { type: string }
        action: { type: string, description: e.g. INVITED, APPROVED, MODIFIED }
        target:
          type: object
          properties:
            kind: { type: string }
            id: { type: string }
            label: { type: string }
        scope:
          type: string
          enum: [WORKSPACE, PROJECT, BILLING, API]
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        diff: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }
