services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: kuiper-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kuiper123
      MYSQL_DATABASE: kuiper
      MYSQL_ROOT_HOST: "%"
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pkuiper123"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: kuiper-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ==================== App (Next.js + Workers) ====================
  app:
    build: .
    container_name: kuiper-app
    restart: unless-stopped
    environment:
      # 数据库（指向容器内部 MySQL，用服务名 mysql 而非 localhost）
      DATABASE_URL: "mysql://root:kuiper123@mysql:3306/kuiper"
      # Redis（指向容器内部 Redis，用服务名 redis）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      REDIS_TLS: ""
      # 存储：R2 云存储（角色图片绑定需要公开 URL）
      STORAGE_TYPE: r2
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL}"
      # 认证
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "502dad8a7a30aa232f1df1f4ab46ec501975f77a3dd11e821211cae6a637fceb"
      # 内部密钥
      CRON_SECRET: "3b500b3b8712cd1e55b2abed03c79887"
      INTERNAL_TASK_TOKEN: "b3ab71ccef17abf5469912932f1fa062"
      API_ENCRYPTION_KEY: "826905b1f3893bc4daa668fcbb09c53b193ff2f701d1d6eb08f2854f316857e1"
      # Worker 配置
      WATCHDOG_INTERVAL_MS: "30000"
      TASK_HEARTBEAT_TIMEOUT_MS: "90000"
      QUEUE_CONCURRENCY_IMAGE: "50"
      QUEUE_CONCURRENCY_VIDEO: "50"
      QUEUE_CONCURRENCY_VOICE: "20"
      QUEUE_CONCURRENCY_TEXT: "50"
      # Bull Board
      BULL_BOARD_HOST: "0.0.0.0"
      BULL_BOARD_PORT: "3010"
      BULL_BOARD_BASE_PATH: "/admin/queues"
      BULL_BOARD_USER: ""
      BULL_BOARD_PASSWORD: ""
      # 日志
      LOG_UNIFIED_ENABLED: "true"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      LOG_DEBUG_ENABLED: "false"
      LOG_AUDIT_ENABLED: "true"
      LOG_SERVICE: "kuiper"
      LOG_REDACT_KEYS: "password,token,apiKey,apikey,authorization,cookie,secret,access_token,refresh_token"
      # 计费
      BILLING_MODE: "OFF"
      # 流式
      LLM_STREAM_EPHEMERAL_ENABLED: "true"
    ports:
      - "13000:3000"
      - "13010:3010"
    volumes:
      - ./data:/app/data
      - ./docker-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma db push --skip-generate &&
        (sleep 5 && echo '' &&
        echo '╔══════════════════════════════════════════════════╗' &&
        echo '║            KuiperAI is ready!                    ║' &&
        echo '║                                                  ║' &&
        echo '║  HTTP:  http://localhost:13000                    ║' &&
        echo '║                                                  ║' &&
        echo '║  For HTTPS, run Caddy on host:                   ║' &&
        echo '║  caddy run --config Caddyfile                    ║' &&
        echo '║  Then open: https://localhost:1443                ║' &&
        echo '╚══════════════════════════════════════════════════╝' &&
        echo '') &
        npm run start
      "

volumes:
  mysql_data:
  redis_data:
