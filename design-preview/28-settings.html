<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KuiperAI · 设置</title>
  <link rel="stylesheet" href="tokens.css">
  <script src="i18n-dict.js"></script>
  <script src="i18n.js" defer></script>
  <style>
    body { background: var(--surface-canvas); display: flex; min-height: 100vh; }

    .side {
      width: 260px; flex-shrink: 0;
      padding: 24px 14px;
      border-right: 1px solid var(--surface-hairline);
    }
    .brand-mini { display: flex; align-items: center; gap: 12px; padding: 4px 8px 28px; font-weight: 600; font-size: 14px; }
    .brand-mark { width: 24px; height: 24px; background: linear-gradient(135deg, var(--primary-500), var(--primary-600)); border-radius: 5px; display: grid; place-items: center; color: var(--neutral-950); font-weight: 700; font-size: 12px; }

    .nav-label { font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.1em; padding: 0 8px 8px; font-weight: 500; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-radius: var(--r-input);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 2px;
      cursor: pointer;
    }
    .nav-item:hover { background: var(--surface-raised); color: var(--text-primary); }
    .nav-item.active { background: var(--surface-raised); color: var(--text-primary); }
    .nav-item .icon { width: 16px; color: var(--text-tertiary); }
    .nav-item.active .icon { color: var(--primary-400); }
    .nav-item.danger { color: var(--error); }
    .nav-item.danger .icon { color: var(--error); }

    .main { flex: 1; overflow-y: auto; }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 40px;
      border-bottom: 1px solid var(--surface-hairline);
    }
    .top h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }

    .content { padding: 40px 40px 80px; max-width: 800px; }
    .sec { margin-bottom: 48px; }
    .sec h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .sec .sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }

    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .field-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .field-input {
      padding: 11px 14px;
      background: var(--surface-raised);
      border: 1px solid var(--surface-hairline);
      border-radius: var(--r-input);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .field-input:focus { border-color: var(--primary-500); box-shadow: 0 0 0 3px rgba(245,194,74,0.15); }

    .field-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 18px;
      background: var(--surface-raised);
      border: 1px solid var(--surface-hairline);
      border-radius: var(--r-card);
      margin-bottom: 8px;
    }
    .field-row .info .k { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .field-row .info .d { font-size: 12px; color: var(--text-tertiary); }
    .sw {
      width: 36px; height: 20px;
      background: var(--neutral-700);
      border-radius: var(--r-pill);
      position: relative;
      cursor: pointer;
    }
    .sw::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: var(--text-primary);
      border-radius: 50%;
    }
    .sw.on { background: var(--primary-500); }
    .sw.on::after { left: 18px; background: var(--neutral-950); }

    .lang-row { display: flex; gap: 8px; }
    .lang-opt {
      flex: 1; padding: 16px;
      background: var(--surface-raised);
      border: 1px solid var(--surface-hairline);
      border-radius: var(--r-card);
      text-align: center;
      cursor: pointer;
    }
    .lang-opt.active {
      border-color: var(--primary-500);
      background: rgba(245, 194, 74, 0.04);
    }
    .lang-opt .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .lang-opt .desc { font-size: 11px; color: var(--text-tertiary); }
    .lang-opt.active .name { color: var(--primary-400); }

    .save-bar {
      padding: 16px 40px;
      border-top: 1px solid var(--surface-hairline);
      background: rgba(245, 194, 74, 0.04);
      display: flex; justify-content: end; gap: 8px;
      position: sticky; bottom: 0;
    }
  </style>
</head>
<body>

  <aside class="side">
    <div class="brand-mini">
      <div class="brand-mark">K</div>
      <span>KuiperAI</span>
    </div>

    <div class="nav-label" data-i18n="s.title">设置</div>
    <a class="nav-item active"><span class="icon">◐</span> <span data-i18n="s.tab.profile">个人资料</span></a>
    <a class="nav-item"><span class="icon">🔔</span> <span data-i18n="s.tab.notifications">通知</span></a>
    <a class="nav-item"><span class="icon">⌨</span> <span data-i18n="s.tab.shortcuts">键盘快捷</span></a>
    <a class="nav-item"><span class="icon">◑</span> <span data-i18n="s.tab.appearance">外观</span></a>
    <a class="nav-item"><span class="icon">🌐</span> <span data-i18n="s.tab.language">语言</span></a>
    <a class="nav-item"><span class="icon">🔑</span> <span data-i18n="s.tab.api">API 密钥</span></a>
    <a class="nav-item"><span class="icon">⊠</span> <span data-i18n="s.tab.account">账号</span></a>
    <a class="nav-item danger"><span class="icon">⚠</span> <span data-i18n="s.tab.danger">危险操作</span></a>
  </aside>

  <main class="main">
    <div class="top">
      <h1 data-i18n="s.tab.profile">个人资料</h1>
      <div style="display: flex; gap: 10px; align-items: center;">
        <div class="lang-switcher">
          <button type="button" data-lang="zh" class="active">中</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <a href="02-home.html" class="btn btn-ghost">完成 →</a>
      </div>
    </div>

    <div class="content">

      <div class="sec">
        <h2>基本资料</h2>
        <p class="sub">这些资讯会在你创作的内容上显示</p>

        <div style="display: flex; gap: 18px; margin-bottom: 28px; align-items: center;">
          <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #4A3AAF, #7C5CFF); border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 600; color: white;">J</div>
          <div>
            <button class="btn btn-ghost" style="margin-right: 6px;">上传头像</button>
            <button class="btn btn-ghost" style="color: var(--error); border-color: rgba(239, 68, 68, 0.3);">移除</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">显示名称</label>
          <input class="field-input" value="Josh Hung" />
        </div>
        <div class="field-group">
          <label class="field-label">Email</label>
          <input class="field-input" value="holykinds@gmail.com" />
        </div>
        <div class="field-group">
          <label class="field-label">公开页 username</label>
          <input class="field-input" value="@joshhung" />
        </div>
      </div>

      <div class="sec">
        <h2 data-i18n="s.tab.language">语言</h2>
        <p class="sub">影响平台介面 — 不影响项目内容</p>

        <div class="lang-row">
          <div class="lang-opt active">
            <div class="name">简体中文</div>
            <div class="desc">Simplified Chinese · zh-CN</div>
          </div>
          <div class="lang-opt">
            <div class="name">English</div>
            <div class="desc">English · en</div>
          </div>
        </div>
      </div>

      <div class="sec">
        <h2 data-i18n="s.tab.notifications">通知</h2>
        <p class="sub">选择哪些事件通知你</p>

        <div class="field-row">
          <div class="info"><div class="k">渲染完成通知</div><div class="d">本集所有面板渲染完成时</div></div>
          <div class="sw on"></div>
        </div>
        <div class="field-row">
          <div class="info"><div class="k">渲染失败提示</div><div class="d">单个面板失败立即提示</div></div>
          <div class="sw on"></div>
        </div>
        <div class="field-row">
          <div class="info"><div class="k">每周成果汇总</div><div class="d">周一寄送本週成片回顾</div></div>
          <div class="sw"></div>
        </div>
        <div class="field-row">
          <div class="info"><div class="k">协作邀请</div><div class="d">有人邀请你加入 workspace</div></div>
          <div class="sw on"></div>
        </div>
      </div>

    </div>

    <div class="save-bar">
      <button class="btn btn-ghost">取消</button>
      <button class="btn btn-primary" data-i18n="s.cta.save">保存</button>
    </div>
  </main>
</body>
</html>
