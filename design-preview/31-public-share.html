  <style>
    body {
      background: var(--surface-canvas);
      min-height: 100vh;
    }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 32px;
      border-bottom: 1px solid var(--surface-hairline);
    }
    .brand-mini { display: flex; align-items: center; gap: 12px; font-weight: 600; }
    .brand-mark { width: 24px; height: 24px; background: linear-gradient(135deg, var(--primary-500), var(--primary-600)); border-radius: 5px; display: grid; place-items: center; color: var(--neutral-950); font-weight: 700; font-size: 12px; }

    .container {
      max-width: 1280px; margin: 0 auto;
      padding: 32px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 32px;
      align-items: start;
    }

    .video-side {
      display: flex; flex-direction: column;
      gap: 18px;
    }
    .video-frame {
      aspect-ratio: 9/16;
      max-height: 80vh;
      width: auto;
      margin: 0 auto;
      border-radius: var(--r-card);
      border: 1px solid var(--surface-hairline);
      position: relative;
      overflow: hidden;
      box-shadow: var(--elev-3);
    }
    .video-frame .scene {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 40%, rgba(120, 80, 50, 0.5), transparent 70%),
        linear-gradient(180deg, #2a1815 0%, #0a0807 80%);
    }
    .video-frame .figure {
      position: absolute; bottom: 18%; left: 50%;
      transform: translateX(-50%); width: 30%; height: 50%;
      background: radial-gradient(ellipse at top, rgba(245, 194, 74, 0.4), transparent 50%),
                  linear-gradient(180deg, rgba(60, 40, 30, 0.9), rgba(20, 10, 5, 0.95));
      border-radius: 50% 50% 30% 30%; filter: blur(1px);
    }
    .video-frame .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6));
    }
    .video-frame .subtitle {
      position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
      padding: 8px 18px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      border-radius: var(--r-input);
      font-size: 14px; color: white;
    }
    .video-frame .timeline {
      position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
      background: rgba(255,255,255,0.1);
    }
    .video-frame .timeline .fill { height: 100%; width: 38%; background: var(--primary-500); }
    .video-frame .play {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 72px; height: 72px;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(16px);
      border-radius: 50%;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .video-frame .play::after {
      content: ''; width: 0; height: 0;
      border-left: 22px solid white;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      margin-left: 6px;
    }

    .video-actions {
      display: flex; gap: 8px; justify-content: center;
    }
    .action-btn {
      padding: 8px 14px;
      background: var(--surface-raised);
      border: 1px solid var(--surface-hairline);
      color: var(--text-secondary);
      border-radius: var(--r-pill);
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .action-btn:hover { color: var(--text-primary); }
    .action-btn.active { background: rgba(245, 194, 74, 0.12); border-color: rgba(245, 194, 74, 0.4); color: var(--primary-400); }
    .action-btn .count { color: var(--text-tertiary); }

    .info-side {
      position: sticky; top: 32px;
    }

    .creator-card {
      padding: 20px;
      background: var(--surface-raised);
      border: 1px solid var(--surface-hairline);
      border-radius: var(--r-card);
      margin-bottom: 16px;
    }
    .creator-card .head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px;
    }
    .creator-card .av {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #7C5CFF, #4A3AAF);
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 18px; font-weight: 600; color: white;
    }
    .creator-card .info { flex: 1; }
    .creator-card .name { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .creator-card .handle { font-size: 12px; color: var(--text-tertiary); }
    .creator-card .stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--surface-hairline);
    }
    .creator-card .stat .v { font-size: 14px; font-weight: 600; }
    .creator-card .stat .k { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }

    .meta-card {
      padding: 18px 20px;
      background: var(--surface-raised);
      border: 1px solid var(--surface-hairline);
      border-radius: var(--r-card);
      margin-bottom: 16px;
    }
    .meta-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .meta-card .badges {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .meta-card .badge {
      padding: 3px 9px;
      background: var(--surface-canvas);
      border: 1px solid var(--surface-hairline);
      border-radius: var(--r-pill);
      font-size: 11px;
      color: var(--text-secondary);
    }
    .meta-card p { font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
    .meta-card .stats {
      display: flex; gap: 16px;
      padding-top: 12px; margin-top: 14px;
      border-top: 1px solid var(--surface-hairline);
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .cta-card {
      padding: 22px;
      background:
        radial-gradient(ellipse at center, rgba(245, 194, 74, 0.08), transparent 70%),
        var(--surface-raised);
      border: 1px solid rgba(245, 194, 74, 0.3);
      border-radius: var(--r-card);
    }
    .cta-card h3 {
      font-size: 16px; font-weight: 600;
      margin-bottom: 6px;
      color: var(--primary-400);
    }
    .cta-card p { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 14px; }
    .cta-card .actions { display: flex; flex-direction: column; gap: 6px; }
    .cta-card .actions .btn { width: 100%; justify-content: center; }
  </style>
