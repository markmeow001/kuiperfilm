  <script src="i18n-dict.js"></script>

  <style>
    body { background: var(--surface-canvas); min-height: 100vh; }
    .top {
      max-width: 1280px; margin: 0 auto;
      padding: 40px 32px 24px;
      display: flex; justify-content: space-between; align-items: end;
      border-bottom: 1px solid var(--surface-hairline);
    }
    .top h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; }
    .top .sub { font-size: 14px; color: var(--text-secondary); }
    .top .badge {
      display: inline-block; padding: 4px 10px;
      background: rgba(245, 194, 74, 0.16); color: var(--primary-400);
      border-radius: var(--r-pill); font-size: 11px; font-weight: 500;
      letter-spacing: 0.04em; margin-right: 8px;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px 80px; }
    .cat-section { margin-bottom: 40px; }
    .cat-title {
      font-size: 18px; font-weight: 600;
      margin-bottom: 14px; color: var(--text-primary);
      display: flex; align-items: center; gap: 10px;
    }
    .cat-count {
      font-size: 11px; color: var(--text-tertiary);
      background: var(--surface-raised);
      padding: 2px 8px; border-radius: var(--r-pill);
      font-family: 'JetBrains Mono', monospace;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .style-card {
      background: var(--surface-raised);
      border: 1px solid var(--surface-hairline);
      border-radius: var(--r-card);
      overflow: hidden;
      cursor: pointer;
      padding: 0;
      text-align: left;
      transition: all var(--d-hover) var(--ease-out);
    }
    .style-card:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 194, 74, 0.5);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }
    .style-card:focus-visible {
      outline: 2px solid var(--primary-500);
      outline-offset: 2px;
    }
    .style-card .thumb {
      aspect-ratio: 1/1;
      background-size: cover;
      background-position: center;
      background-color: var(--neutral-800);
    }
    .style-card .meta { padding: 10px 12px 12px; }
    .style-card .name-zh { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .style-card .name-en { font-size: 11px; color: var(--text-tertiary); }
    /* Lighting cards 用紫色框作區分 */
    .style-card[data-kind="lighting"] {
      border-color: rgba(124, 92, 255, 0.25);
    }
    .style-card[data-kind="lighting"]:hover {
      border-color: rgba(124, 92, 255, 0.6);
    }
  </style>
</head>
